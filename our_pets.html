<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Our Pets</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="#">
          <div class="logo">
            <h1>Cozy House</h1>
            <p>Shelter for pets in Boston</p>
          </div></a
        >
        <div class="navigation">
          <ul>
            <li><a href="">About the shelter</a></li>
            <li><a href="">Our pets</a></li>
            <li><a href="#help">Help the shelter</a></li>
            <li><a href="#footer">Contacts</a></li>
          </ul>
        </div>
      </div>
    </header>
    <main></main>
    <footer id="footer" class="footer">
      <div class="container">
        <div class="contacts">
          <h3>
            For questions <br />
            and suggestions
          </h3>
          <a href="https://mail.google.com/">
            <div class="email">
              <img src="./assets/img/mail.png" alt="mail" />
              <h4>email@shelter.com</h4>
            </div>
          </a>
          <a href="tel:+13 674 567 75 54">
            <div class="phone">
              <img src="./assets/img/phone.png" alt="phone" />
              <h4>+13 674 567 75 54</h4>
            </div>
          </a>
        </div>
        <div class="location">
          <h3>
            We are waiting <br />
            for your visit
          </h3>
          <a
            href="https://www.google.com/maps/search/?api=1&query=1+Central+Street,+Boston"
          >
            <div class="address">
              <img src="./assets/img/pin.png" alt="pin" />
              <h4>
                1 Central Street, Boston <br />
                (entrance from the store)
              </h4>
            </div>
          </a>

          <a
            href="https://www.google.com/maps/search/?api=1&query=18+South+Park,+London"
          >
            <div class="address">
              <img src="./assets/img/pin.png" alt="pin" />
              <h4>18 South Park, London</h4>
            </div>
          </a>
        </div>
        <img src="./assets/img/footer-puppy.png" alt="footer-puppy" />
      </div>
    </footer>
  </body>
</html>
